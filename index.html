<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IKD Jamaica Mockup Review</title>
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <main class="site-shell">
    <header class="masthead">
      <img class="brand-mark" src="assets/img/ikd-logo.jpeg" alt="International Karate Daigaku logo">
      <div>
        <p class="eyebrow">Client Review Board</p>
        <h1>IKD Jamaica website mockups</h1>
      </div>
    </header>

    <section class="intro" aria-label="Mockup gallery introduction">
      <p>Select a mockup to review the full HTML concept and leave comments for revisions.</p>
      <span class="count-pill" id="mockupTotal">0 mockups</span>
    </section>

    <section class="mockup-grid" id="mockupGrid" aria-label="Available mockups"></section>
  </main>

  <script src="assets/js/mockups.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
